<svg xmlns="http://www.w3.org/2000/svg" width="282" height="388" viewBox="0 0 282 388" role="img"><title>부분합 대화 상자. 품명 기준, 합계 함수, 단가 체크. 새로운 값으로 대치와 데이터 아래 요약 표시 체크, 그룹 사이 페이지 나누기는 체크 안 됨.</title><rect x="1" y="1" width="280" height="386" fill="#ededed" stroke="#888"/><rect x="2" y="2" width="278" height="30" fill="#e8eff4"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#222"><text x="10" y="22">부분합</text><text x="201" y="22">?</text><text x="250" y="22">×</text><text x="10" y="56">그룹화할 항목(A):</text><rect x="10" y="64" width="260" height="25" fill="#fff" stroke="#aaa"/><text x="14" y="81">품명　　　　　　　　　　　　 ⌄</text><text x="10" y="106">사용할 함수(U):</text><rect x="10" y="114" width="260" height="25" fill="#fff" stroke="#aaa"/><text x="14" y="131">합계　　　　　　　　　　　　 ⌄</text><text x="10" y="158">부분합 계산 항목(D):</text><rect x="10" y="166" width="260" height="95" fill="#fff" stroke="#aaa"/><text x="14" y="181">☐ 품명</text><text x="14" y="196">☐ 수량</text><rect x="13" y="198" width="241" height="16" fill="#2d76b8"/><text x="14" y="211" fill="#fff">☑ 단가</text><text x="253" y="181" fill="#999">▴</text><text x="253" y="253" fill="#999">▾</text><text x="10" y="291">☑ 새로운 값으로 대치(C)</text><text x="10" y="315">☐ 그룹 사이에서 페이지 나누기(P)</text><text x="10" y="339">☑ 데이터 아래에 요약 표시(S)</text><g fill="#fff" stroke="#bbb"><rect x="10" y="354" width="85" height="25" rx="3"/><rect x="107" y="354" width="76" height="25" rx="3"/><rect x="194" y="354" width="76" height="25" rx="3"/></g><text x="16" y="372">모두 제거(R)</text><text x="133" y="372">확인</text><text x="220" y="372">취소</text></g></svg>