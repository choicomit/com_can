<svg xmlns="http://www.w3.org/2000/svg" width="325" height="454" viewBox="0 0 325 454" role="img"><title>부분합 대화 상자: 부서명 기준, 합계 함수, 점수 선택</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="14" fill="#222"><rect x="1" y="1" width="323" height="452" fill="#ededed" stroke="#888"/><rect x="2" y="2" width="321" height="32" fill="#e8eff4" stroke="#e8eff4"/><text x="12" y="24" font-size="14">부분합</text><text x="238" y="24" font-size="14">?      ×</text><text x="12" y="57" font-size="14">그룹화할 항목(A):</text><rect x="12" y="66" width="301" height="29" fill="white" stroke="#aaa"/><text x="17" y="86" font-size="14">부서명</text><text x="293" y="86" font-size="14">⌄</text><text x="12" y="115" font-size="14">사용할 함수(U):</text><rect x="12" y="124" width="301" height="29" fill="white" stroke="#aaa"/><text x="17" y="144" font-size="14">합계</text><text x="293" y="144" font-size="14">⌄</text><text x="12" y="176" font-size="14">부분합 계산 항목(D):</text><rect x="12" y="186" width="301" height="111" fill="white" stroke="#aaa"/><rect x="16" y="191" width="13" height="13" fill="white" stroke="#aaa"/><text x="34" y="203" font-size="14">부서명</text><rect x="15" y="207" width="277" height="18" fill="#177bbc" stroke="#177bbc"/><text x="17" y="221" font-size="14">☑ 점수</text><text x="298" y="202" font-size="14">▴</text><text x="298" y="289" font-size="14">▾</text><rect x="12" y="313" width="14" height="14" fill="#177bbc" stroke="#aaa"/><text x="13" y="325" font-size="12">✓</text><text x="32" y="325" font-size="14">새로운 값으로 대치(C)</text><rect x="12" y="341" width="14" height="14" fill="white" stroke="#aaa"/><text x="13" y="353" font-size="12"></text><text x="32" y="353" font-size="14">그룹 사이에서 페이지 나누기(P)</text><rect x="12" y="369" width="14" height="14" fill="#177bbc" stroke="#aaa"/><text x="13" y="381" font-size="12">✓</text><text x="32" y="381" font-size="14">데이터 아래에 요약 표시(S)</text><rect x="12" y="408" width="100" height="30" fill="white" stroke="#aaa"/><text x="22" y="429" font-size="14">모두 제거(R)</text><rect x="124" y="408" width="88" height="30" fill="white" stroke="#aaa"/><text x="134" y="429" font-size="14">확인</text><rect x="225" y="408" width="88" height="30" fill="white" stroke="#aaa"/><text x="235" y="429" font-size="14">취소</text></g></svg>